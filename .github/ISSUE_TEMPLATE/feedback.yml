name: Share feedback
description: You ran Clinescope on your own Cline trace. Tell me how it went.
title: "[feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Clinescope. Only the first box is required, and one sentence in it is worth
        more to me than a filled-in form. Everything below it is optional. For a reproducible scorer or
        CLI bug, the Bug report form is a better fit; for a rough thought that fits neither, Discussions
        is open.
  - type: textarea
    id: disagreement
    attributes:
      label: Did any score disagree with your own read of the run?
      description: Which scorer, what it said, and what you thought instead. If they all matched your read, say that; it is still an answer. This is the only field I need.
      placeholder: "e.g. diff_minimality gave it 100/100, but the agent retyped a whole function to change one line and I would have called that wasteful."
    validations:
      required: true
  - type: dropdown
    id: ran-it
    attributes:
      label: What did you run it on?
      options:
        - "A real Cline session of mine"
        - "The bundled examples / clinescope-corpus only"
        - "I just read the docs / repo"
    validations:
      required: false
  - type: textarea
    id: first-impression
    attributes:
      label: Your first-run impression
      description: What was your reaction after the first scored run? Did the output make sense? Did you trust the scores? What worked, and what did not?
      placeholder: "e.g. I scored a qwen2.5-coder run; the advice for diff_coherence made sense, but I was not sure what 'blind rewrite' meant or whether to trust the number."
    validations:
      required: false
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or missing
      description: Anything unclear, any scorer you did not trust, anything you wished it did.
    validations:
      required: false
  - type: dropdown
    id: use-again
    attributes:
      label: Would you use it again?
      options:
        - "Yes"
        - "Maybe, if it did X (say what in the boxes above)"
        - "Probably not"
    validations:
      required: false
