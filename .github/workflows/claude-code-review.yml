name: Claude Code Review

on:
  pull_request:
    # synchronize is REQUIRED here, and the reason is not cost, it is correctness.
    # `claude-review` is a required status check on main (ruleset main-guard). A required
    # check has to report against the pull request's HEAD SHA. Drop synchronize and the
    # first follow-up push produces a head SHA this workflow never runs on, so the check
    # sits pending forever and the pull request can never merge.
    #
    # The per-push cost is smaller than it looks: the action skips a pull request it has
    # already commented on, and a skip still reports a passing check in seconds.
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Deliberately a job timeout and NOT --max-turns. A turn cap ends the run quietly and
    # can publish a partial review that reads like a complete one; a timeout fails the job
    # visibly. For a review, a loud failure beats a silent truncation.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

