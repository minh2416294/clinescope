name: Claude Code Review

on:
  pull_request:
    # synchronize is REQUIRED here, and the reason is not cost, it is correctness.
    # `claude-review` is a required status check on main (ruleset main-guard). A required
    # check has to report against the pull request's HEAD SHA. Drop synchronize and the
    # first follow-up push produces a head SHA this workflow never runs on, so the check
    # sits pending forever and the pull request can never merge.
    #
    # The per-push cost is smaller than it looks: the action skips a pull request it has
    # already commented on, and a skip still reports a passing check in seconds.
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Deliberately a job timeout and NOT --max-turns. A turn cap ends the run quietly and
    # can publish a partial review that reads like a complete one; a timeout fails the job
    # visibly. For a review, a loud failure beats a silent truncation.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1
        with:
          # Subscription auth, NOT an API key. These are different credentials on different
          # inputs: a sk-ant-oat01 token presented as anthropic_api_key is rejected, and the
          # failure is quiet. The job still runs for minutes and then reports is_error with
          # num_turns 1, total_cost_usd 0 and an empty modelUsage, which reads like a broken
          # review rather than a rejected credential.
          #
          # `/install-github-app` generates the anthropic_api_key form. If it is ever re-run,
          # check this line before merging what it produces.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The three gh tools are REQUIRED. The plugin reads the pull request with gh pr view and
          # gh pr diff, and posts its summary with gh pr comment. With only the inline-comment tool
          # allowed, the run on #140, #142 and #144 stopped at the plugin's first step (5 or 6
          # turns, about 20 seconds, no Opus agent, one permission denial), posted nothing, and
          # still passed. The same three are in the action's own example,
          # examples/pr-review-comprehensive.yml at the SHA pinned above.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          # REQUIRED since v1.0.238. Claude Code 2.1.286 starts the plugin's eligibility agent in the
          # background; the model then ends its turn to wait, which ends a one-shot run, so the
          # review never resumes and posts nothing (run 37139197879 shows it). Disabling
          # background tasks makes every agent run in the foreground.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

