name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Test (with coverage gate)
        run: pytest -q --cov=clinescope --cov-report=term-missing --cov-fail-under=90
      # Dogfooding: this project's own CI runs the gate it ships. Both directions are
      # asserted, because a step that only ever expects exit 0 would still pass if the
      # gate stopped failing anything at all.
      #
      # The negative case asserts the EXACT code, not merely "did not pass". Exit 2 is
      # the gate's usage error, which it also returns for a missing file or a trace
      # with no apply_patch, so a looser `if ! gate ...` check would keep passing if
      # this trace were renamed or lost its patch. That would leave CI green while
      # testing nothing, which is the failure this step exists to prevent.
      - name: Dogfood clinescope-gate on committed traces
        run: |
          clinescope-gate examples/apply-patch-trace.json --min-diff-coherence 0.75 --min-diff-minimality 0.75
          set +e
          clinescope-gate examples/gate-regression-badpatch.json --min-diff-coherence 1.0
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 on the regression trace, got $code"; exit 1; }
