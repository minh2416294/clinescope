<svg xmlns='http://www.w3.org/2000/svg' width='900' height='778' viewBox='0 0 900 778' role='img' aria-label='clinescope scoring three real Cline runs: a clean run passes, a run with an unrecovered failed patch, and a run where the model called no tools; the two failing runs say what went wrong, what to do and why'><style>.scene{opacity:0;animation:cycle 12.60s infinite}.s1{animation-delay:-4.20s}.s2{animation-delay:-8.40s}@keyframes cycle{0%{opacity:1}30.16%{opacity:1}33.33%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.scene{animation:none}.s0{opacity:1}}</style><rect x='0' y='0' width='900' height='778' rx='10' fill='#1e1f29'/><rect x='0' y='0' width='900' height='40' fill='#2a2b38'/><circle cx='22' cy='26' r='6' fill='#ff5555'/><circle cx='42' cy='26' r='6' fill='#f1fa8c'/><circle cx='62' cy='26' r='6' fill='#50fa7b'/><text x='450' y='30' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='13' text-anchor='middle'>clinescope</text><g class='scene s0'><text x='22.0' y='74.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>$ clinescope --demo</text><text x='22.0' y='118.0' fill='#ff5555' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Clinescope found 1 problem in this Cline run.</text><text x='22.0' y='162.0' fill='#ff5555' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Problem</text><text x='22.0' y='184.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Cline marked the agent&#x27;s edit to &#x27;validator.py&#x27; as failed.</text><text x='22.0' y='206.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- No later edit to that file went through.</text><text x='22.0' y='250.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>What to do</text><text x='22.0' y='272.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Your prompt should tell the agent to retry after a failed edit.</text><text x='22.0' y='294.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent should re-read the file first.</text><text x='22.0' y='316.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Then it should try a corrected edit instead of giving up.</text><text x='22.0' y='360.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Why</text><text x='22.0' y='382.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Clinescope only counts a later edit to the same file with the same tool.</text><text x='22.0' y='404.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- A fix made another way does not show up in this check.</text><text x='22.0' y='448.0' fill='#50fa7b' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>What went well</text><text x='22.0' y='470.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent used every tool you listed.</text><text x='22.0' y='492.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent&#x27;s first patch follows the format Cline expects.</text><text x='22.0' y='514.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- No part of the patch was deleted and retyped whole.</text><text x='22.0' y='558.0' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Session &#x27;1783723826783_g3hi7&#x27;</text></g><g class='scene s1'><text x='22.0' y='74.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>$ clinescope live-gpt-oss-trace.json --expected read_files apply_patch</text><text x='22.0' y='118.0' fill='#50fa7b' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Clinescope found no problems in the checks below.</text><text x='22.0' y='162.0' fill='#50fa7b' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>What went well</text><text x='22.0' y='184.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent used every tool you listed.</text><text x='22.0' y='206.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent&#x27;s first patch follows the format Cline expects.</text><text x='22.0' y='228.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- No part of the patch was deleted and retyped whole.</text><text x='22.0' y='250.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- No edit failed, so there was nothing to retry.</text><text x='22.0' y='294.0' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Session &#x27;1783709423832_y5y2f&#x27;</text></g><g class='scene s2'><text x='22.0' y='74.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>$ clinescope qwen-missing-tools.json --expected read_files apply_patch</text><text x='22.0' y='118.0' fill='#ff5555' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Clinescope found 2 problems in this Cline run.</text><text x='22.0' y='162.0' fill='#ff5555' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Problem 1 of 2</text><text x='22.0' y='184.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent never used apply_patch or read_files.</text><text x='22.0' y='206.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- You listed them as tools the agent should use.</text><text x='22.0' y='250.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>What to do</text><text x='22.0' y='272.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Your prompt should name the tools the agent must use.</text><text x='22.0' y='294.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- One example rule is &quot;Always read a file with read_files before you patch it.&quot;</text><text x='22.0' y='338.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Why</text><text x='22.0' y='360.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Clinescope only checks that each tool you listed was called.</text><text x='22.0' y='382.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- It does not check what the agent sent to the tool.</text><text x='22.0' y='426.0' fill='#ff5555' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Problem 2 of 2</text><text x='22.0' y='448.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- The agent made no edit that Clinescope can check.</text><text x='22.0' y='492.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>What to do</text><text x='22.0' y='514.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- If the agent changed files another way, this is expected.</text><text x='22.0' y='536.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- If the task needed an edit and none happened, your prompt should tell the agent to</text><text x='22.0' y='558.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>  edit the file with its tools.</text><text x='22.0' y='602.0' fill='#f1fa8c' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Why</text><text x='22.0' y='624.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Clinescope checks the format of only one kind of edit.</text><text x='22.0' y='646.0' fill='#f8f8f2' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- Clinescope found no edit of that kind.</text><text x='22.0' y='690.0' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Did not apply</text><text x='22.0' y='712.0' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>- 2 checks did not apply, because the run had no patch to read.</text><text x='22.0' y='756.0' fill='#6d6f85' font-family='SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace' font-size='15' xml:space='preserve'>Session &#x27;1783823285576_8f1km&#x27;</text></g></svg>